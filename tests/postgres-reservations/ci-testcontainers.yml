# Copy into .github/workflows/reservation-integration.yml in this package's repository.
name: PostgreSQL reservation integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: docker info
      - run: python -m pytest -v --junitxml=test-results.xml
        env:
          BIDFORGE_TEST_BACKEND: testcontainers
          BIDFORGE_POSTGRES_IMAGE: postgres:16.4-alpine
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reservation-test-results
          path: test-results.xml
