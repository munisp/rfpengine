global:
  resolve_timeout: 5m

route:
  receiver: local-alert-inbox
  group_by: [alertname, service, sqlstate]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: local-alert-inbox
    webhook_configs:
      - url: http://local-alert-receiver:8095/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/alert-webhook-token
