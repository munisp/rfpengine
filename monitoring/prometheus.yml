global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts/reservation-alerts.yml

scrape_configs:
  - job_name: live-evidence
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics-token
    static_configs:
      - targets: ["live-evidence:8080"]

  - job_name: postgres-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["postgres-exporter:9187"]
