name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bidforge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript checks, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm check
      - name: Run Vitest with JUnit report
        if: ${{ always() }}
        run: |
          mkdir -p artifacts
          pnpm exec vitest run --reporter=default --reporter=junit --outputFile.junit=artifacts/vitest.junit.xml
      - name: Build application
        if: ${{ always() }}
        run: pnpm build
      - name: Upload TypeScript JUnit result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: typescript-junit
          path: artifacts/vitest.junit.xml
          if-no-files-found: warn
          retention-days: 14

  live-evidence:
    name: Live evidence PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: bidforge_live_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bidforge_live_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bidforge_live_test
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      BIDFORGE_TEST_BACKEND: testcontainers
      BIDFORGE_POSTGRES_IMAGE: postgres:16.4-alpine
      BIDFORGE_SOURCE_ROOT: ${{ github.workspace }}/services/live-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/live-evidence/requirements.txt
            tests/postgres-reservations/requirements-test.txt
      - name: Install PostgreSQL client used by service integration tests
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r services/live-evidence/requirements.txt -r tests/postgres-reservations/requirements-test.txt
      - name: Verify Docker is usable for Testcontainers
        run: docker info
      - name: Test live-evidence service source against PostgreSQL
        run: |
          mkdir -p artifacts
          python -m pytest -v services/live-evidence/tests --junitxml=artifacts/live-evidence.junit.xml
      - name: Test reservations against actual live-evidence source with Testcontainers
        if: ${{ always() }}
        working-directory: tests/postgres-reservations
        run: python -m pytest -v --junitxml=../../artifacts/reservations.junit.xml
      - name: Upload Python JUnit results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: live-evidence-junit
          path: artifacts/*.junit.xml
          if-no-files-found: warn
          retention-days: 14

  full-stack-smoke:
    name: Local Compose full-stack smoke
    runs-on: ubuntu-latest
    needs: [typescript, live-evidence, monitoring]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned browser smoke dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Build and wait for the complete local stack
        run: ./scripts/local-stack.sh up
      - name: Verify web, APIs, monitoring, alert delivery, and browser flow
        run: ./scripts/local-stack.sh test
      - name: Collect Compose diagnostics
        if: ${{ always() }}
        run: |
          mkdir -p artifacts
          docker compose --project-name bidforge-local --file compose.yaml ps > artifacts/compose-ps.txt || true
          docker compose --project-name bidforge-local --file compose.yaml logs --no-color > artifacts/compose.log || true
      - name: Upload Compose diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-compose-diagnostics
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop local stack without deleting volumes
        if: ${{ always() }}
        run: ./scripts/local-stack.sh down

  monitoring:
    name: Monitoring receiver and alert-rule tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install monitoring test dependencies
        run: python -m pip install -r monitoring/requirements.txt
      - name: Test alert receiver authentication, delivery and retention
        run: python -m pytest -q monitoring/tests
      - name: Validate Prometheus rules and routing
        run: |
          mkdir -p /tmp/promtool-secrets /tmp/prometheus-ci/alerts
          cp monitoring/prometheus.yml /tmp/prometheus-ci/prometheus.yml
          cp monitoring/reservation-alerts.yml /tmp/prometheus-ci/alerts/reservation-alerts.yml
          printf 'ci-monitor-token-fixture-not-a-live-credential\n' > /tmp/promtool-secrets/metrics-token
          chmod 644 /tmp/promtool-secrets/metrics-token
          docker run --rm --entrypoint promtool -v /tmp/prometheus-ci:/etc/prometheus:ro -v "$PWD/monitoring:/rules:ro" -v /tmp/promtool-secrets:/run/secrets:ro prom/prometheus:v2.54.1 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/rules:ro" prom/prometheus:v2.54.1 check rules /rules/reservation-alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/rules:ro" prom/prometheus:v2.54.1 test rules /rules/tests/reservation-alerts.test.yml
      - name: Validate Alertmanager routing
        run: docker run --rm --entrypoint amtool -v "$PWD/monitoring:/config:ro" prom/alertmanager:v0.27.0 check-config /config/alertmanager.yml
